services:
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio-storage:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio@123
    command: server --console-address ":9001" /data
    networks:
      - datanet

  postgres-metastore:
    image: postgres:14
    container_name: postgres-metastore
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
      POSTGRES_HOST_AUTH_METHOD: password
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
      - ./pg-metastore-data:/var/lib/postgresql/data
    networks:
      - datanet

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    depends_on:
      - postgres-metastore
      - minio
    environment:
      SERVICE_NAME: metastore
      HIVE_METASTORE_DB_TYPE: postgres
      HIVE_METASTORE_USER: hive
      HIVE_METASTORE_PASSWORD: hive
      HIVE_METASTORE_DB_HOST: postgres-metastore
      HIVE_METASTORE_DB_NAME: metastore
      DB_DRIVER: postgres
    volumes:
      - ./hive-conf:/opt/hive/conf
      - ./jars/postgresql-42.6.2.jar:/opt/hive/lib/postgresql-42.6.2.jar
      - ./jars/hadoop-aws-3.3.4.jar:/opt/hive/lib/hadoop-aws-3.3.4.jar
      - ./jars/aws-java-sdk-bundle-1.12.367.jar:/opt/hive/lib/aws-java-sdk-bundle-1.12.367.jar
    ports:
      - "9083:9083"
    networks:
      - datanet

  hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server
    depends_on:
      - hive-metastore
    environment:
      SERVICE_NAME: metastore
      HIVE_METASTORE_DB_TYPE: postgres
      HIVE_METASTORE_USER: hive
      HIVE_METASTORE_PASSWORD: hive
      HIVE_METASTORE_DB_HOST: postgres-metastore
      HIVE_METASTORE_DB_NAME: metastore
      DB_DRIVER: postgres
    volumes:
      - ./hive-conf:/opt/hive/conf
      - ./jars/postgresql-42.6.2.jar:/opt/hive/lib/postgresql-42.6.2.jar
      - ./jars/hadoop-aws-3.3.4.jar:/opt/hive/lib/hadoop-aws-3.3.4.jar
      - ./jars/aws-java-sdk-bundle-1.12.367.jar:/opt/hive/lib/aws-java-sdk-bundle-1.12.367.jar
    ports:
      - "10000:10000"
    networks:
      - datanet

  trino-coordinator:
    image: trinodb/trino:441
    container_name: trino-coordinator
    hostname: trino-coordinator
    ports:
      - "8081:8080"
    volumes:
      - ./trino/coordinator:/etc/trino
    environment:
      - NODE_ID=1
    networks:
      - datanet

  trino-worker:
    image: trinodb/trino:441
    container_name: trino-worker
    hostname: trino-worker
    volumes:
      - ./trino/worker:/etc/trino
    environment:
      - NODE_ID=2
    networks:
      - datanet

  spark-master:
    image: spark:3.5.6-scala2.12-java11-python3-r-ubuntu
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_MEMORY=1G
      - SPARK_MASTER_CORES=1
      - SPARK_NO_DAEMONIZE=false
    volumes:
      - ./hive-conf/hive-site.xml:/opt/spark/conf/hive-site.xml
      - ./jars/hadoop-aws-3.3.4.jar:/opt/spark/jars/hadoop-aws-3.3.4.jar
      - ./jars/aws-java-sdk-bundle-1.12.367.jar:/opt/spark/jars/aws-java-sdk-bundle-1.12.237.jar
      - ./jars/iceberg-spark-runtime-3.5_2.12-1.5.2.jar:/opt/spark/jars/iceberg-spark-runtime-3.5_2.12-1.5.2.jar
      - ./spark-jobs:/opt/spark/jobs
    command: /opt/spark/sbin/start-master.sh
    depends_on:
      - hive-server
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    networks:
      - datanet

  spark-worker:
    image: spark:3.5.6-scala2.12-java11-python3-r-ubuntu
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - SPARK_NO_DAEMONIZE=false
    volumes:
      - ./hive-conf/hive-site.xml:/opt/spark/conf/hive-site.xml
      - ./jars/hadoop-aws-3.3.4.jar:/opt/spark/jars/hadoop-aws-3.3.4.jar
      - ./jars/aws-java-sdk-bundle-1.12.367.jar:/opt/spark/jars/aws-java-sdk-bundle-1.12.237.jar
      - ./jars/iceberg-spark-runtime-3.5_2.12-1.5.2.jar:/opt/spark/jars/iceberg-spark-runtime-3.5_2.12-1.5.2.jar
    command: /opt/spark/sbin/start-worker.sh spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    networks:
      - datanet
  # ===================== AIRFLOW =====================
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - datanet


  airflow-init:
    image: apache/airflow:2.7.3
    container_name: airflow-init
    depends_on:
      - postgres-metastore
      - redis
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://hive:hive@postgres-metastore:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://hive:hive@postgres-metastore:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=31E1-24OEkjXpTnzoypiTODWKtA3GUlRuqZjnkc9e20=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_WWW_USER_CREATE=True
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    entrypoint: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin --firstname Air --lastname Flow --role Admin --email admin@example.com"
    networks:
      - datanet

  airflow-webserver:
    container_name: airflow-webserver
    depends_on:
      - airflow-init
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: apache-airflow:2.7.3-java11
    restart: always
    ports:
      - "8083:8080"
    environment:
      - AIRFLOW__WEBSERVER__SECRET_KEY=bb640ec7bda506f7deaa46500f964e1c
      - AIRFLOW__CORE__FERNET_KEY=31E1-24OEkjXpTnzoypiTODWKtA3GUlRuqZjnkc9e20=
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://hive:hive@postgres-metastore:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://hive:hive@postgres-metastore:5432/airflow
#      - _PIP_ADDITIONAL_REQUIREMENTS=-r /requirements/requirements.txt
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/requirements:/requirements
      - ./airflow/spark-jobs:/opt/airflow/jobs
    command: webserver
    networks:
      - datanet

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: apache-airflow:2.7.3-java11
    container_name: airflow-scheduler
    depends_on:
      - airflow-webserver
    restart: always
    environment:
      - AIRFLOW__WEBSERVER__SECRET_KEY=bb640ec7bda506f7deaa46500f964e1c
      - AIRFLOW__CORE__FERNET_KEY=31E1-24OEkjXpTnzoypiTODWKtA3GUlRuqZjnkc9e20=
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://hive:hive@postgres-metastore:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://hive:hive@postgres-metastore:5432/airflow
#      - _PIP_ADDITIONAL_REQUIREMENTS=-r /requirements/requirements.txt
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/requirements:/requirements
      - ./airflow/spark-jobs:/opt/airflow/jobs
    command: scheduler
    networks:
      - datanet

  airflow-worker:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: apache-airflow:2.7.3-java11
    container_name: airflow-worker
    depends_on:
      - airflow-scheduler
    restart: always
    environment:
      - AIRFLOW__WEBSERVER__SECRET_KEY=bb640ec7bda506f7deaa46500f964e1c
      - AIRFLOW__CORE__FERNET_KEY=31E1-24OEkjXpTnzoypiTODWKtA3GUlRuqZjnkc9e20=
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://hive:hive@postgres-metastore:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://hive:hive@postgres-metastore:5432/airflow
#      - _PIP_ADDITIONAL_REQUIREMENTS=-r /requirements/requirements.txt
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/requirements:/requirements
      - ./airflow/spark-jobs:/opt/airflow/jobs
    command: celery worker
    networks:
      - datanet

  airflow-triggerer:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: apache-airflow:2.7.3-java11
    container_name: airflow-triggerer
    depends_on:
      - airflow-scheduler
    restart: always
    environment:
      - AIRFLOW__WEBSERVER__SECRET_KEY=bb640ec7bda506f7deaa46500f964e1c
      - AIRFLOW__CORE__FERNET_KEY=31E1-24OEkjXpTnzoypiTODWKtA3GUlRuqZjnkc9e20=
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://hive:hive@postgres-metastore:5432/airflow
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=db+postgresql://hive:hive@postgres-metastore:5432/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/requirements:/requirements
      - ./airflow/spark-jobs:/opt/airflow/jobs
    command: triggerer
    networks:
      - datanet

networks:
  datanet:
    driver: bridge
